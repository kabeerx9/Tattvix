<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>Tattwix</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Boot splash: painted before the JS bundle loads, so it must be plain
      HTML + CSS with hard-coded values (theme tokens aren't loaded yet).
      React fades it out via src/lib/boot-splash.ts once auth resolves.
      The mark and wordmark mirror BrandLogo (src/components/brand.tsx);
      keep the "Threshold" paths in sync with it.
    -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: #ffffff; color: #222222;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 220ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #boot-splash.is-done { opacity: 0; pointer-events: none; }
      .bs-wrap { display: grid; justify-items: center; gap: 14px; }
      .bs-brand { display: flex; align-items: center; gap: 12px; }
      .bs-mark { width: 40px; height: 40px; fill: #222222; opacity: 0; animation: bs-fade 240ms cubic-bezier(0.23, 1, 0.32, 1) forwards; }
      @keyframes bs-fade { to { opacity: 1; } }
      .bs-word { display: flex; font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; overflow: hidden; padding: 4px 2px; }
      .bs-word span { display: inline-block; transform: translateY(110%); animation: bs-rise 240ms cubic-bezier(0.23, 1, 0.32, 1) forwards; animation-delay: calc(var(--i) * 30ms); }
      .bs-line { width: 176px; height: 2px; background: #ebebeb; border-radius: 2px; position: relative; overflow: hidden; }
      .bs-line i { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #222222 30%, #222222 70%, transparent); transform: translateX(-100%); animation: bs-sweep 1.6s 0.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .bs-status { position: relative; width: 220px; height: 16px; font-size: 12px; color: #717171; text-align: center; }
      .bs-status span { position: absolute; inset: 0; opacity: 0; animation: bs-cycle 7.5s infinite; animation-delay: calc(0.8s + var(--i) * 2.5s); }
      @keyframes bs-rise { to { transform: translateY(0); } }
      @keyframes bs-sweep { to { transform: translateX(100%); } }
      @keyframes bs-cycle {
        0% { opacity: 0; transform: translateY(4px); }
        4%, 30% { opacity: 1; transform: none; }
        34%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bs-word span { animation: none; transform: none; }
        .bs-mark { animation: none; opacity: 1; }
        .bs-line i { animation: none; transform: none; opacity: 0.35; }
        .bs-status span { animation: none; }
        .bs-status span:first-child { opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="bs-wrap">
        <div class="bs-brand">
          <svg class="bs-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 56V8h40v20H40V20H24v36Z"/><path d="M40 36h12v20H40Z"/></svg>
          <div class="bs-word" aria-label="Tattwix">
            <span style="--i: 0">T</span><span style="--i: 1">a</span><span style="--i: 2">t</span><span style="--i: 3">t</span><span style="--i: 4">w</span><span style="--i: 5">i</span><span style="--i: 6">x</span>
          </div>
        </div>
        <div class="bs-line"><i></i></div>
        <div class="bs-status">
          <span style="--i: 0">Preparing your workspace</span>
          <span style="--i: 1">Securing your session</span>
          <span style="--i: 2">Almost there</span>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
