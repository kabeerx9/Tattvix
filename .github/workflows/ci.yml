name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Django settings import requires DATABASE_URL; tests swap in TEST_DATABASE_URL.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  DATABASE_SSL_REQUIRE: "false"
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  # Build-time placeholders for t3-env validation; never shipped anywhere.
  VITE_SERVER_URL: http://localhost:3000
  VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci-placeholder

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --locked
        working-directory: apps/server

      - name: Type checks
        run: pnpm run check-types

      - name: Tests
        run: pnpm test
