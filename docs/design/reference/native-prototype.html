<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tattwix native screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#222222; --muted:#6a6a6a; --subtle:#717171; --border:#dddddd; --soft:#ebebeb; --fill:#f7f7f7;
    --primary:#d70f58; --success:#067647; --success-tint:#ecfdf3; --warning:#b54708; --warning-tint:#fef4e6; --destructive:#b42318;
    --card-r:16px; --shadow:0 1px 2px rgb(0 0 0/.04),0 6px 16px rgb(0 0 0/.06);
    --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:#ececec;color:var(--fg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
  .stage{min-height:100%;display:grid;grid-template-rows:1fr auto;place-items:start center;padding:16px 16px 0}
  .phone-wrap{height:calc(844px * var(--s,1));width:calc(390px * var(--s,1))}
  .phone-wrap .phone{transform:scale(var(--s,1));transform-origin:top left}
  /* phone */
  .phone{width:390px;height:844px;background:var(--bg);border-radius:40px;box-shadow:0 30px 80px rgb(0 0 0/.25),0 0 0 10px #111,0 0 0 12px #333;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
  .status .pill{width:110px;height:26px;background:#111;border-radius:14px;position:absolute;left:50%;top:10px;transform:translateX(-50%)}
  .screen{flex:1;overflow:auto;position:relative;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .content{padding:8px 20px 120px}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;border-top:1px solid var(--border);background:rgb(255 255 255/.96);backdrop-filter:blur(10px);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:14px}
  .tab{display:grid;place-content:center;justify-items:center;gap:4px;font-size:11px;color:var(--muted);position:relative}
  .tab svg{width:24px;height:24px;stroke-width:1.6}
  .tab.on{color:var(--fg);font-weight:600}
  .tab.on svg{stroke-width:2.1}
  .tab.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:3px;background:var(--primary);border-radius:0 0 999px 999px}
  .tab .avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border)}
  .tab.on .avatar{border-color:var(--fg)}
  .home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:2}
  /* type */
  .large{font-size:30px;line-height:34px;font-weight:700;letter-spacing:-.6px;margin-top:12px}
  .meta{font-size:15px;color:var(--muted);margin-top:6px}
  .section{font-size:22px;line-height:26px;font-weight:600;letter-spacing:-.3px}
  .section-meta{font-size:14px;color:var(--muted);margin-top:4px}
  .sec{margin-top:36px}
  .row-between{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .link{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:4px;color:var(--fg)}
  /* pills */
  .pills{display:flex;gap:8px;overflow:auto;margin:16px -20px 0;padding:0 20px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill-tab{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;background:#fff}
  .pill-tab b{font-weight:600;color:var(--muted)}
  .pill-tab.on{background:var(--fg);color:#fff;border-color:var(--fg)}
  .pill-tab.on b{color:rgb(255 255 255/.7)}
  /* cards */
  .rail{display:flex;gap:12px;overflow:auto;margin:16px -20px 0;padding:4px 20px 12px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .card{flex:none;width:84%;background:#fff;border:1px solid var(--border);border-radius:var(--card-r);box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
  .card .top{display:flex;align-items:center;gap:12px}
  .initials{width:44px;height:44px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--fg)}
  .name{font-size:16px;font-weight:600}
  .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .facts{display:flex;gap:16px;font-size:13px;color:var(--muted)}
  .facts b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--fg)}
  .badge.ok{background:var(--success-tint);color:var(--success)}
  .badge.warn{background:var(--warning-tint);color:var(--warning)}
  .btn{height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;gap:8px;transition:transform 140ms var(--ease-out)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.outline{border:1px solid var(--fg);color:var(--fg);background:#fff}
  .btn.ghost{background:var(--fill);color:var(--fg)}
  .btn.sm{height:38px;font-size:14px;border-radius:9px}
  .room{flex:none;width:62%;display:grid;gap:8px}
  .room .photo{aspect-ratio:4/3;border-radius:12px;background:#e9e9e9 center/cover;position:relative;overflow:hidden}
  .room .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgb(0 0 0/.45))}
  .room .photo span{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:600;font-size:15px;z-index:1}
  .room .cap{font-size:13px;color:var(--muted)}
  .room .cap b{color:var(--fg);font-weight:500}
  .panel{border:1px solid var(--border);border-radius:var(--card-r);box-shadow:var(--shadow);margin-top:16px;background:#fff}
  .lrow{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;border-top:1px solid var(--soft)}
  .lrow:first-child{border-top:0}
  .lrow svg{width:22px;height:22px;stroke-width:1.6;color:var(--fg);flex:none}
  .lrow .t{font-size:15px;font-weight:500}
  .lrow .d{font-size:13px;color:var(--muted);margin-top:2px}
  .lrow .grow{flex:1}
  .lrow .chev{color:var(--subtle);width:18px;height:18px}
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px}
  .kpi{padding:14px 16px;border:1px solid var(--border);border-radius:var(--card-r);box-shadow:var(--shadow)}
  .kpi .l{font-size:13px;color:var(--muted)}
  .kpi .v{font-size:26px;font-weight:600;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
  /* header for secondary screens */
  .hdr{display:flex;align-items:center;gap:8px;height:48px;margin:0 -8px}
  .hdr .back{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
  .hdr .back svg{width:22px;height:22px;stroke-width:2}
  .hdr .ttl{font-size:17px;font-weight:600;flex:1;text-align:center;margin-right:40px}
  .page{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-top:8px}
  .label{font-size:12px;color:var(--subtle);margin-bottom:4px}
  .val{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:16px}
  .ph{height:140px;border-radius:12px;background:#e9e9e9 center/cover}
  /* sheet */
  .scrim{position:absolute;inset:0;background:rgb(0 0 0/.35);z-index:5}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:6;padding:8px 20px 36px;box-shadow:0 2px 4px rgb(0 0 0/.05),0 12px 32px rgb(0 0 0/.12);animation:up 240ms var(--ease-drawer)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grab{width:36px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 14px}
  .sheet h3{font-size:18px;font-weight:600;margin-bottom:2px}
  .sheet .who{display:flex;align-items:center;gap:12px;padding:10px 0 4px}
  .srow{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 0;border-top:1px solid var(--soft)}
  .srow:first-of-type{border-top:0}
  .srow .pic{width:44px;height:44px;border-radius:10px;background:var(--fill) center/cover;display:grid;place-items:center;font-weight:600;flex:none}
  .srow .pic.round{border-radius:50%}
  .srow .t{font-size:15px;font-weight:500}
  .srow .d{font-size:13px;color:var(--muted);margin-top:2px}
  .check{margin-left:auto;width:22px;height:22px;color:var(--fg);stroke-width:2.4}
  .eyebrowless{font-size:12px;color:var(--subtle);margin:16px 0 6px;font-weight:500}
  /* QR screens */
  .qrwrap{display:grid;place-items:center;gap:0}
  .qr{width:270px;height:270px;background:#fff}
  .qrcard{border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:24px;display:grid;justify-items:center;gap:18px;margin-top:28px}
  .qr-ttl{font-size:22px;font-weight:600;letter-spacing:-.3px;text-align:center}
  .qr-sub{font-size:15px;color:var(--muted);text-align:center;line-height:22px}
  .foot{font-size:13px;color:var(--subtle);text-align:center}
  .dark .phone{background:#111;color:#fff}
  /* sign in */
  .brand{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:40px}
  .hero{font-size:34px;line-height:38px;font-weight:700;letter-spacing:-1px;margin-top:64px}
  .hero-sub{font-size:16px;color:var(--muted);line-height:24px;margin-top:12px}
  .input{height:50px;border:1px solid #929292;border-radius:10px;display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--subtle)}
  .form{display:grid;gap:12px;margin-top:40px}
  .or{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--subtle)}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
  .photo-hero{height:260px;margin:-8px -20px 0;background:center/cover;position:relative}
  .photo-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0/.1),rgb(0 0 0/.55))}
  .photo-hero .t{position:absolute;left:20px;bottom:18px;color:#fff;z-index:1}
  .photo-hero .t b{font-size:26px;font-weight:700;letter-spacing:-.5px;display:block}
  .photo-hero .t span{font-size:14px;opacity:.9}
  /* picker */
  .picker{position:sticky;bottom:0;width:100%;z-index:10;background:#1b1b1b;color:#ddd;font-size:13px;padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:24px}
  .picker button{background:#2b2b2b;border:0;color:#ddd;padding:8px 12px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
  .picker button.on{background:#fff;color:#111}
  .picker .k{opacity:.5;margin-right:4px;font-size:11px}
  .picker .sep{width:1px;height:20px;background:#444;margin:0 6px}
  .note{font-size:12px;color:#999;width:100%;text-align:center;margin-top:4px}
  [hidden]{display:none!important}
  /* brand */
  .logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .logo svg{width:22px;height:22px;fill:currentColor}
  /* splash: the Threshold mark opens, then the name settles beside it */
  .splash{position:absolute;inset:0;background:#fff;display:grid;place-items:center}
  .splash .mark{width:88px;height:88px;overflow:visible}
  .splash .frame{fill:#222;transform-origin:50% 100%;animation:frameIn 520ms var(--ease-out) both}
  .splash .leaf{fill:#222;transform-origin:0 50%;transform:translateX(26px);opacity:0;animation:leafIn 460ms var(--ease-out) 260ms both}
  .splash .word{font-size:34px;font-weight:700;letter-spacing:-.04em;color:#222;margin-left:14px;opacity:0;transform:translateX(-10px);animation:wordIn 420ms var(--ease-out) 560ms both}
  .splash .lockup{display:flex;align-items:center;animation:settle 500ms var(--ease-out) 1000ms both}
  .splash .tag{position:absolute;bottom:72px;font-size:13px;color:var(--subtle);opacity:0;animation:fade 400ms ease 1100ms both}
  @keyframes frameIn{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
  @keyframes leafIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes wordIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  @keyframes settle{from{transform:scale(1)}to{transform:scale(.94)}}
  @keyframes fade{to{opacity:1}}
  .splash .seam{position:absolute;left:50%;top:50%;width:3px;height:0;background:var(--primary);transform:translate(-50%,-50%);border-radius:2px;opacity:0}
  @media (prefers-reduced-motion:reduce){.splash *{animation-duration:1ms!important;animation-delay:0ms!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone-wrap"><div class="phone" id="phone"></div></div>
  <div class="picker" id="picker"></div>
</div>

<script>

const I = {

const P = {
  deluxe:'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=800&q=70',
  suite:'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=800&q=70',
  standard:'https://images.unsplash.com/photo-1566665797739-1674de7a421a?w=800&q=70',

// ---------- fake QR (deterministic) ----------
function qr(size=270, seed=7){
  const n=29, cell=size/n; let s=seed; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  let out=`<svg class="qr" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">`;
  const finder=(x,y)=>`<rect x="${x*cell}" y="${y*cell}" width="${7*cell}" height="${7*cell}" fill="#111"/><rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/><rect x="${(x+2)*cell}" y="${(y+2)*cell}" width="${3*cell}" height="${3*cell}" fill="#111"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const inF=(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8); if(inF)continue;
    if(rnd()>0.52)out+=`<rect x="${x*cell}" y="${y*cell}" width="${cell+.3}" height="${cell+.3}" fill="#111"/>`;
  }
  out+=finder(0,0)+finder(n-7,0)+finder(0,n-7)+'</svg>'; return out;
}

const screens = [
  ['0','Splash',()=>S.splash()],
  ['1','Sign in',()=>S.signin()],
  ['2','Today',()=>S.today('A')],
  ['3','Stay',()=>S.stay()],
  ['4','Desk QR',()=>S.qrA()],
  ['5','Switcher',()=>S.switcher('A')],
  ['6','Guest home',()=>S.guest()],
];
const state={screen:'0'};
function render(){
  const s=screens.find(x=>x[0]===state.screen); document.getElementById('phone').innerHTML=s[2]();
  const p=document.getElementById('picker');
  p.innerHTML = screens.map(([k,l])=>`<button class="${k===state.screen?'on':''}" data-s="${k}"><span class="k">${k}</span>${l}</button>`).join('')
   + `<span class="sep"></span><button data-replay="1"><span class="k">R</span>Replay splash</button>`
   + `<div class="note">Keys 0–6 switch screens · R replays the splash · scroll inside the phone</div>`;
  p.querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(b.dataset.s)state.screen=b.dataset.s; if(b.dataset.replay)state.screen='0'; render(); });
}
document.addEventListener('keydown',e=>{ if('0123456'.includes(e.key)){state.screen=e.key;render()} if(e.key==='r'||e.key==='R'){state.screen='0';render()} });
function fit(){ const s=Math.min(1,(innerHeight-16-96)/844); document.documentElement.style.setProperty('--s',s.toFixed(3)); }
addEventListener('resize',fit); fit(); render();
</script>
