name: tattvix-local-storage

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: tattvix-local-only
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      MINIO_ROOT_USER: tattvix-minio-admin
      MINIO_ROOT_PASSWORD: tattvix-minio-admin-local-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    volumes:
      - ./infra/minio:/policies:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 tattvix-minio-admin tattvix-minio-admin-local-only; do sleep 1; done;
      mc mb --ignore-existing local/tattvix-identity-documents-dev;
      mc anonymous set none local/tattvix-identity-documents-dev;
      mc admin user add local tattvix-server tattvix-server-local-only;
      mc admin policy create local tattvix-identity-documents /policies/identity-documents-policy.json;
      mc admin policy attach local tattvix-identity-documents --user tattvix-server;
      "

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./apps/server/.env
    environment:
      # In-container hostnames override the localhost defaults in .env.
      # compose `environment` wins over both env_file and the bind-mounted
      # .env that settings.py loads via load_dotenv.
      DATABASE_URL: postgresql://postgres:tattvix-local-only@postgres:5432/postgres
      DATABASE_SSL_REQUIRE: "false"
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/server:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
